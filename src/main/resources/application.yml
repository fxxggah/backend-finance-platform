spring:
  application:
    name: finance-platform
  profiles:
    active: dev

server:
  port: ${PORT:8080}

app:
  billing:
    enabled: ${FIN_BILLING_ENABLED:false}
    secret-key: ${FIN_STRIPE_SECRET_KEY:}
    webhook-secret: ${FIN_STRIPE_WEBHOOK_SECRET:}
    price-id: ${FIN_STRIPE_PRICE_ID:}
    portal-configuration-id: ${FIN_STRIPE_PORTAL_CONFIGURATION_ID:}
    frontend-origin: ${FIN_BILLING_FRONTEND_ORIGIN:http://localhost:3000}
  ai:
    enabled: ${FIN_AI_ENABLED:false}
    ffprobe-path: ${FIN_FFPROBE_PATH:}
    quota:
      user-successes-per-day: ${FIN_AI_USER_SUCCESSES_PER_DAY:10}
      global-attempts-per-minute: ${FIN_AI_GLOBAL_ATTEMPTS_PER_MINUTE:10}
      global-attempts-per-day: ${FIN_AI_GLOBAL_ATTEMPTS_PER_DAY:400}
      lease-seconds: ${FIN_AI_LEASE_SECONDS:120}
      provider-cooldown-seconds: ${FIN_AI_PROVIDER_COOLDOWN_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

