spring:
  application:
    name: finance-platform
  profiles:
    active: dev

server:
  port: ${PORT:8080}

app:
  ai:
    enabled: ${FIN_AI_ENABLED:false}
    ffprobe-path: ${FIN_FFPROBE_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

